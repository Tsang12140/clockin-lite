services:
  db:
    image: postgres:16-alpine
    container_name: clockin-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-clockin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-clockin}
      POSTGRES_DB: ${POSTGRES_DB:-clockin}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - clockin-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-clockin} -d ${POSTGRES_DB:-clockin}"]
      interval: 10s
      timeout: 5s
      retries: 8

  app:
    build: .
    container_name: clockin-lite
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: ${APP_DATABASE_URL:-postgresql://clockin:clockin@db:5432/clockin}
      SESSION_SECRET: ${SESSION_SECRET:?Set SESSION_SECRET in .env}
      AI_CONFIG_SECRET: ${AI_CONFIG_SECRET:-}
      DEV_PASSWORD: ${DEV_PASSWORD:-2468}
      QWEATHER_KEY: ${QWEATHER_KEY:-}
      QWEATHER_LOCATION: ${QWEATHER_LOCATION:-}
      QWEATHER_CITY: ${QWEATHER_CITY:-}
      AI_ENABLED: ${AI_ENABLED:-false}
      AI_PROVIDER: ${AI_PROVIDER:-openai}
      AI_API_KEY: ${AI_API_KEY:-}
      AI_BASE_URL: ${AI_BASE_URL:-}
      AI_MODEL: ${AI_MODEL:-}
      BACKUP_DIR: ${BACKUP_DIR:-/app/backups}
      PG_DUMP_PATH: ${PG_DUMP_PATH:-pg_dump}
      BACKUP_S3_ENABLED: ${BACKUP_S3_ENABLED:-false}
      BACKUP_S3_ENDPOINT: ${BACKUP_S3_ENDPOINT:-}
      BACKUP_S3_REGION: ${BACKUP_S3_REGION:-}
      BACKUP_S3_BUCKET: ${BACKUP_S3_BUCKET:-}
      BACKUP_S3_PREFIX: ${BACKUP_S3_PREFIX:-backups/db}
      BACKUP_S3_FORCE_PATH_STYLE: ${BACKUP_S3_FORCE_PATH_STYLE:-true}
      BACKUP_S3_ACCESS_KEY_ID: ${BACKUP_S3_ACCESS_KEY_ID:-}
      BACKUP_S3_SECRET_ACCESS_KEY: ${BACKUP_S3_SECRET_ACCESS_KEY:-}
    ports:
      - "${APP_PORT:-3000}:3000"
    volumes:
      - clockin-backups:/app/backups

volumes:
  clockin-postgres-data:
  clockin-backups:

